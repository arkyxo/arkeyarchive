<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arkey — Aspiring Network Engineer</title>
<meta name="description" content="Portfolio of Arkey (Rose Kate Zonio), an aspiring Network Engineer and Computer Engineering student." />

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="root"></div>

<script>
  fetch("script.js")
    .then((res) => res.text())
    .then((code) => {
      const output = Babel.transform(code, {
        presets: [["react", { runtime: "classic" }]],
        filename: "script.js",
      }).code;
      const tag = document.createElement("script");
      tag.textContent = output;
      document.body.appendChild(tag);
    })
    .catch((err) => {
      document.getElementById("root").innerHTML =
        '<p style="font-family:monospace;color:#f87171;padding:24px;">Failed to load script.js: ' + err + "</p>";
    });
</script>

</body>
</html>
